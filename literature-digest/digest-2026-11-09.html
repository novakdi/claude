<title>Marrow Digest 9 Nov</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
/* Layout: masthead + filter chips + single reading column of paper cards; slide-stain palette (hematoxylin / eosin) */
:root{
  --bg:#f3f3f7; --surface:#ffffff; --fg:#1d1b2b; --muted:#5d5a72; --line:#dcdbe6;
  --hema:#4a3f8f; --hema-soft:#e8e5f6; --eosin:#b83a6e; --eosin-soft:#f8e4ec; --ok:#1f7a5a;
  --serif:"Source Serif 4",Georgia,serif; --sans:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14131d; --surface:#1d1c2a; --fg:#ecebf5; --muted:#a6a3bd; --line:#34324a;
  --hema:#a99cf0; --hema-soft:#2c2850; --eosin:#f08ab3; --eosin-soft:#44212f; --ok:#5fd0a5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14131d; --surface:#1d1c2a; --fg:#ecebf5; --muted:#a6a3bd; --line:#34324a;
  --hema:#a99cf0; --hema-soft:#2c2850; --eosin:#f08ab3; --eosin-soft:#44212f; --ok:#5fd0a5; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:32px 64px}
.wrap{max-width:820px;margin-inline:auto;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-direction:column;gap:10px;border-bottom:2px solid var(--hema);padding-bottom:20px}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--eosin)}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(30px,6vw,44px);line-height:1.1;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:0;max-width:65ch}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 13px var(--sans);padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--hema);border-color:var(--hema);color:var(--surface)}
.chip:focus-visible,a:focus-visible{outline:2px solid var(--eosin);outline-offset:2px}
.group{display:flex;flex-direction:column;gap:14px}
.group h2{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:500}
article{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-family:var(--mono);font-size:12px;color:var(--muted)}
.tag{background:var(--hema-soft);color:var(--hema);padding:2px 8px;border-radius:3px;font-weight:500}
.tag.pre{background:var(--eosin-soft);color:var(--eosin)}
.rel{display:inline-flex;gap:3px;align-items:center}
.rel i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.rel i.on{background:var(--eosin)}
h3{font-family:var(--serif);font-weight:600;font-size:21px;line-height:1.25;margin:0;text-wrap:balance}
.sum{margin:0;max-width:65ch}
h4{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--hema);margin:0 0 6px;font-weight:500}
ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px;max-width:65ch}
li::marker{color:var(--eosin)}
.why{background:var(--hema-soft);border-radius:4px;padding:10px 12px;font-size:14px}
.links{display:flex;flex-wrap:wrap;gap:6px 16px;font-family:var(--mono);font-size:12px}
a{color:var(--hema)}
footer{color:var(--muted);font-size:12px;font-family:var(--mono)}
@media(max-width:480px){article{padding:16px}}
</style>
<div class="wrap">
<header>
  <div class="kicker" id="kick">Digest · 9 Nov 2026</div>
  <h1>Marrow Digest</h1>
  <p class="lede">Eight papers: spatial proteomics in AML, pediatric AML relapse and risk, intravital imaging of the AML niche, and genetics of BCOR mutations in MDS and marrow failure.</p>
  <div class="chips" id="chips" role="group" aria-label="Filter by topic"></div>
</header>
<main id="main" class="wrap" style="gap:28px"></main>
<footer>PubMed, entries up to the digest date. Preprints are not peer reviewed.</footer>
</div>
<script>
const G={"s": "Spatial proteomics and imaging", "p": "Pediatric AML, MDS and JMML", "o": "MDS and related disorders"};
const P=[{"j": "bioRxiv · May 2026", "t": "Niche-level immune evasion in TP53-mutant AML residual disease revealed by spatial proteomics", "rel": 5, "tag": "bioRxiv preprint", "sum": "Sequential immunofluorescence on whole bone marrow biopsies from TP53-wild-type and TP53-mutant AML, at diagnosis and in morphological complete remission. Mutant cells were identified by high p53 and mapped against stromal and immune niches.", "f": ["At remission, TP53-mutant marrow shows B-cell loss and more regulatory T cells.", "Erythroid and immature leukemia clusters persist in perisinusoidal niches, apart from T-cell clusters.", "FOXP3-high Tregs sit close to mutant MRD cells.", "scRNA-seq points to an erythroid to T-cell GDF15–CD48 axis as the suppression route."], "why": "Spatial marrow map of AML tied to residual disease and relapse risk, the closest match to your project.", "doi": "10.64898/2026.05.15.725421", "pre": 1, "pmid": "42239259", "g": "s"}, {"j": "Cancer Discovery · Aug 2026", "t": "Same-slide spatial multiomics with IN-DEPTH reveals tumor virus-linked reorganization of the microenvironment", "rel": 4, "tag": "Method", "sum": "Single-cell spatial proteomics imaging guides spatial transcriptomic capture on the same slide without RNA loss. A graph method (SGCC) links protein and RNA layers. Tested on EBV-positive and EBV-negative DLBCL.", "f": ["Protein-first design keeps epitopes, RNA quality and tissue intact on commercial platforms.", "Found coordinated tumor, macrophage and CD4 T-cell remodeling, C1Q-high suppressive macrophages and a candidate IL27–STAT3 axis."], "why": "One way to add transcriptomics to multiplexed protein imaging.", "doi": "10.1158/2159-8290.CD-25-0775", "pmid": "41874448", "g": "s"}, {"j": "Cancer Research · Jul 2026", "t": "CellFuse enables multimodal integration of single-cell and spatial proteomics data for systems-level analysis in cancer", "rel": 4, "tag": "Method", "sum": "Supervised contrastive learning framework that integrates cytometry, CITE-seq and spatial proteomics even when few markers are shared.", "f": ["Accurate cross-modality label transfer that outperforms existing methods in blood, bone marrow and lymphoma, including rare subsets.", "In solid tumors it reconstructs spatial microenvironments whose interactions correlate with treatment response."], "why": "Directly useful for combining CODEX-type data with flow or CITE-seq.", "doi": "10.1158/0008-5472.CAN-25-3699", "pmid": "42084223", "g": "s"}, {"j": "Methods Mol Biol · 2026", "t": "Intravital imaging of early AML expansion in the mouse calvarial bone marrow", "rel": 4, "tag": "Protocol", "sum": "Step-by-step protocols for tracking early HoxA9-Meis1 AML expansion relative to local bone remodeling in live mouse calvaria.", "f": ["Leukemic cells expanded almost only in marrow cavities undergoing active bone remodeling.", "Protocols cover labeling, imaging of leukemia, vasculature and bone remodeling together, plus image analysis.", "Can be combined with spatially resolved tissue isolation and sequencing."], "why": "Murine in vivo imaging of the AML niche, useful for your functional validation work.", "doi": "10.1007/978-1-0716-5591-7_7", "pmid": "42957952", "g": "s"}, {"j": "Nature Communications · Oct 2026", "t": "Characterization of chemoresistant cell populations improves risk stratification and therapy prediction in pediatric AML", "rel": 5, "tag": "Original research", "sum": "Single-cell transcriptomes of paired diagnosis and relapse samples were used to infer chemoresistant populations, then combined with cytogenetics and MRD after induction.", "f": ["Nearly 40% of pediatric AML patients relapse and die.", "The combined approach finds a group of 20% of patients not transplanted in first remission, with 5-year event-free survival below 40% and almost half of the deaths.", "Chemoresistant populations show therapeutic vulnerabilities for high-risk disease."], "why": "Pediatric AML with outcome-linked single-cell data and better risk groups, the same kind of link you want from spatial data.", "doi": "10.1038/s41467-026-78283-5", "pmid": "42957737", "g": "p"}, {"j": "Life Science Alliance · Aug 2026", "t": "Single-cell chromatin profiling reveals relapse-related priming in pediatric AML", "rel": 4, "tag": "Original research", "sum": "scATAC-seq of 177,500 cells from 16 diagnostic pediatric AML samples (t(8;21), inv(16), FLT3-ITD) with long-term outcome, comparing relapsed and non-relapsed patients.", "f": ["Relapse-linked chromatin signatures are visible at diagnosis across subtypes.", "Higher innate immune and inflammatory activation, and more HSC/MPP-like leukemic progenitors.", "AP-1, RUNX1, SPI1 and ETS motifs drive the relapse state, and their high expression predicts worse survival in other AML cohorts."], "why": "Pediatric cohort with outcome data.", "doi": "10.26508/lsa.202603746", "pmid": "42637517", "g": "p"}, {"j": "Cancer Letters · Oct 2026", "t": "Reactive oxygen species define leukemia stem cell identity in pediatric AML", "rel": 4, "tag": "Original research", "sum": "Pediatric AML cells were sorted by ROS level and tested for stemness, niche behavior and metabolism, including in mice and a 3D niche model.", "f": ["ROS-low cells are quiescent, form colonies serially and engraft in mice.", "In the 3D niche model they settle in hypoxic regions and resist cytarabine.", "Low oxidative phosphorylation, yet they depend on complex I.", "A ROS-low gene signature finds stem cells in scRNA-seq data and is prognostic."], "why": "Links stem cell state to hypoxic niche location in children.", "doi": "10.1016/j.canlet.2026.218866", "pmid": "42830144", "g": "p"}, {"j": "Am J Hematol · Nov 2026", "t": "Distinct consequences of BCOR and BCORL1 mutations in myeloid neoplasms and bone marrow failure", "rel": 3, "tag": "Original research", "sum": "Analysis of 11,340 patients, 418 with BCOR/BCORL1 mutations, with single-cell DNA sequencing and longitudinal data.", "f": ["In myeloid neoplasms the mutations are usually secondary and linked to older age and worse survival; in marrow failure they are primary and not prognostic.", "BCOR/L1-mutant clones often shrink over time; progression tracks with extra mutations, especially RUNX1.", "In marrow failure they tend to predict a good response to immunosuppression; BCOR loss lowers HLA class I, hinting at immune privilege."], "why": "Genetic context for MDS and marrow failure that overlaps with pediatric disease.", "doi": "10.1002/ajh.70542", "pmid": "42998044", "g": "o"}];
const main=document.getElementById('main'),chips=document.getElementById('chips');
let cur='all';
function render(){
  main.innerHTML='';
  for(const k of Object.keys(G)){
    if(cur!=='all'&&cur!==k)continue;
    const items=P.filter(p=>p.g===k); if(!items.length)continue;
    const sec=document.createElement('section');sec.className='group';
    sec.innerHTML='<h2>'+G[k]+' ('+items.length+')</h2>';
    for(const p of items){
      const a=document.createElement('article');
      a.innerHTML='<div class="meta"><span class="tag'+(p.pre?' pre':'')+'">'+p.tag+'</span><span>'+p.j+'</span><span class="rel" title="Relevance to your project: '+p.rel+' of 5" aria-label="Relevance '+p.rel+' of 5">'+[1,2,3,4,5].map(i=>'<i class="'+(i<=p.rel?'on':'')+'"></i>').join('')+'</span></div>'+
      '<h3>'+p.t+'</h3><p class="sum">'+p.sum+'</p><div><h4>Main findings</h4><ul>'+p.f.map(x=>'<li>'+x+'</li>').join('')+'</ul></div>'+
      '<div class="why"><strong>Why it matters for you:</strong> '+p.why+'</div>'+
      '<div class="links"><a href="https://pubmed.ncbi.nlm.nih.gov/'+p.pmid+'/" target="_blank" rel="noopener">PMID '+p.pmid+'</a><a href="https://doi.org/'+p.doi+'" target="_blank" rel="noopener">DOI '+p.doi+'</a></div>';
      sec.appendChild(a);
    }
    main.appendChild(sec);
  }
}
function mk(k,l){const b=document.createElement('button');b.className='chip';b.type='button';b.textContent=l;b.setAttribute('aria-pressed',k===cur);b.onclick=()=>{cur=k;[...chips.children].forEach(c=>c.setAttribute('aria-pressed',c===b));render()};chips.appendChild(b)}
mk('all','All '+P.length);for(const k in G)mk(k,G[k]);
render();
</script>
