<title>Marrow Digest 19 Oct</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
/* Layout: masthead + filter chips + single reading column of paper cards; slide-stain palette (hematoxylin / eosin) */
:root{
  --bg:#f3f3f7; --surface:#ffffff; --fg:#1d1b2b; --muted:#5d5a72; --line:#dcdbe6;
  --hema:#4a3f8f; --hema-soft:#e8e5f6; --eosin:#b83a6e; --eosin-soft:#f8e4ec; --ok:#1f7a5a;
  --serif:"Source Serif 4",Georgia,serif; --sans:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14131d; --surface:#1d1c2a; --fg:#ecebf5; --muted:#a6a3bd; --line:#34324a;
  --hema:#a99cf0; --hema-soft:#2c2850; --eosin:#f08ab3; --eosin-soft:#44212f; --ok:#5fd0a5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14131d; --surface:#1d1c2a; --fg:#ecebf5; --muted:#a6a3bd; --line:#34324a;
  --hema:#a99cf0; --hema-soft:#2c2850; --eosin:#f08ab3; --eosin-soft:#44212f; --ok:#5fd0a5; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:32px 64px}
.wrap{max-width:820px;margin-inline:auto;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-direction:column;gap:10px;border-bottom:2px solid var(--hema);padding-bottom:20px}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--eosin)}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(30px,6vw,44px);line-height:1.1;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:0;max-width:65ch}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 13px var(--sans);padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--hema);border-color:var(--hema);color:var(--surface)}
.chip:focus-visible,a:focus-visible{outline:2px solid var(--eosin);outline-offset:2px}
.group{display:flex;flex-direction:column;gap:14px}
.group h2{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:500}
article{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-family:var(--mono);font-size:12px;color:var(--muted)}
.tag{background:var(--hema-soft);color:var(--hema);padding:2px 8px;border-radius:3px;font-weight:500}
.tag.pre{background:var(--eosin-soft);color:var(--eosin)}
.rel{display:inline-flex;gap:3px;align-items:center}
.rel i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.rel i.on{background:var(--eosin)}
h3{font-family:var(--serif);font-weight:600;font-size:21px;line-height:1.25;margin:0;text-wrap:balance}
.sum{margin:0;max-width:65ch}
h4{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--hema);margin:0 0 6px;font-weight:500}
ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px;max-width:65ch}
li::marker{color:var(--eosin)}
.why{background:var(--hema-soft);border-radius:4px;padding:10px 12px;font-size:14px}
.links{display:flex;flex-wrap:wrap;gap:6px 16px;font-family:var(--mono);font-size:12px}
a{color:var(--hema)}
footer{color:var(--muted);font-size:12px;font-family:var(--mono)}
@media(max-width:480px){article{padding:16px}}
</style>
<div class="wrap">
<header>
  <div class="kicker" id="kick">Digest · 19 Oct 2026</div>
  <h1>Marrow Digest</h1>
  <p class="lede">Eight papers on response to therapy in AML, T-cell states, mouse niche models and multiplexed imaging in other tissues. No new pediatric CODEX paper this cycle.</p>
  <div class="chips" id="chips" role="group" aria-label="Filter by topic"></div>
</header>
<main id="main" class="wrap" style="gap:28px"></main>
<footer>PubMed, entries up to the digest date. Preprints are not peer reviewed.</footer>
</div>
<script>
const G={"s": "Spatial proteomics and imaging", "p": "Pediatric AML, MDS and JMML", "n": "AML microenvironment and mouse models", "o": "MDS and related disorders"};
const P=[{"j": "Cancer Letters · Oct 2026", "t": "Reactive oxygen species define leukemia stem cell identity in pediatric AML", "rel": 4, "tag": "Original research", "sum": "Pediatric AML cells were sorted by ROS level and tested for stemness, niche behavior and metabolism, including in mice and a 3D niche model.", "f": ["ROS-low cells are quiescent, form colonies serially and engraft in mice.", "In the 3D niche model they settle in hypoxic regions and resist cytarabine.", "Low oxidative phosphorylation, yet they depend on complex I.", "A ROS-low gene signature finds stem cells in scRNA-seq data and is prognostic."], "why": "Links stem cell state to hypoxic niche location in children.", "doi": "10.1016/j.canlet.2026.218866", "pmid": "42830144", "g": "p"}, {"j": "HemaSphere · 2026", "t": "Immune and cellular determinants of response to HMA-venetoclax in AML", "rel": 4, "tag": "Original research", "sum": "132 patients with clinical and genomic data, plus scRNA-seq and TCR sequencing in 10 patients.", "f": ["Responders have expanded cytotoxic CD8 T cells, higher TCR diversity and antigen-presentation activation.", "Non-responders show inflammatory signaling, impaired myeloid maturation, an IDO1+ dendritic-cell-rich suppressive niche and a stem-like, EMT state.", "LAG-3 marks dysfunctional T cells and is a candidate biomarker or target."], "why": "Ties marrow immune composition to therapy response, the question in your aim 2.", "doi": "10.1002/hem3.70498", "pmid": "42871763", "g": "n"}, {"j": "bioRxiv · Sep 2026", "t": "Clonally expanded CD8 T cells in AML adopt an NK-like program", "rel": 3, "tag": "bioRxiv preprint", "sum": "Mass cytometry of 46 diagnostic AML marrows plus scRNA-seq and TCR sequencing.", "f": ["CD8 T cells skew to TEMRA; classic exhaustion is rare.", "TEMRA cells are functional (IFNγ and TNFα).", "The most expanded clones, of unknown specificity, express NK receptors (LaNKi score), validated in other datasets."], "why": "Describes the T-cell states you would see in a marrow CODEX panel.", "doi": "10.64898/2026.09.30.755147", "pre": 1, "pmid": "42856304", "g": "n"}, {"j": "Int J Mol Sci · 2026", "t": "Inflammatory network remodeling in AML is driven by neutrophil-centric self-amplifying circuits", "rel": 2, "tag": "Original research", "sum": "scRNA-seq of 3 AML and 6 donor samples with CellChat, plus Luminex cytokines in 46 AML and 26 controls.", "f": ["Communication shifts from T cells toward myeloid cells and neutrophils (CXCL8–CXCR2, CCL3–CCR1).", "An inflammatory risk score (CXCL8, CCL2, IL-1A; C-index 0.729) splits ELN2022 intermediate risk.", "Very small scRNA-seq cohort."], "why": "Cytokine-based risk readout, though the single-cell cohort is small.", "doi": "10.3390/ijms27198703", "pmid": "42883947", "g": "n"}, {"j": "JCI Insight · Oct 2026", "t": "Latexin deletion in the bone marrow niche suppresses leukemia via LIFR downregulation and immune activation", "rel": 3, "tag": "Original research", "sum": "MLL-AF9 AML transplanted into Lxn-knockout recipient mice, with stromal scRNA-seq.", "f": ["Lxn-knockout recipients live longer and have fewer LSCs and blasts.", "Lower LIFR signaling in MSCs raises Cxcl9 and recruits more cytotoxic CD8 T cells.", "Adding anti-PD-1 prolongs survival further."], "why": "A good template for niche-focused murine validation, which is your aim 3.", "doi": "10.1172/jci.insight.199771", "pmid": "42847991", "g": "n"}, {"j": "Cells · 2026", "t": "Targeting TGFBR1 with TP-6379 improves hematopoiesis in low-risk MDS ex vivo", "rel": 3, "tag": "Original research", "sum": "Primary low-risk MDS marrow cells treated with the ALK5-specific inhibitor TP-6379, plus S100A9-transgenic mice.", "f": ["S100A9-driven inflammation and TGFβ impair MDS hematopoiesis.", "TP-6379 restored hematopoiesis, especially in spliceosome-mutant samples, and rescued the S100A9 effect.", "Validated in S100A9-transgenic mice."], "why": "MDS niche inflammation with a murine model.", "doi": "10.3390/cells15181674", "pmid": "42782774", "g": "o"}, {"j": "Front Immunol · 2026", "t": "T cells form distinct spatially restricted immune responses in synovium of psoriatic arthritis and rheumatoid arthritis", "rel": 4, "tag": "Original research", "sum": "High-multiplex IHC on synovial biopsies with neighborhood analysis around lining fibroblasts.", "f": ["In PsA, Th1 and Th17 cells sit closest to fibroblasts, then Th2 and Th9.", "In RA, Th9, Th17 and Th22 form the barrier.", "Methotrexate is linked to about 50% fewer Th cells nearby."], "why": "A multiplexed imaging immunology paper with stromal-centered neighborhood analysis and a treatment comparison.", "doi": "10.3389/fimmu.2026.1946638", "pmid": "42876702", "g": "s"}, {"j": "Cancers · Sep 2026", "t": "Single-cell and multi-omics profiling of the multiple myeloma immune niche", "rel": 3, "tag": "Review", "sum": "Review of spatial transcriptomics and multiplexed imaging of the myeloma marrow.", "f": ["Immune exclusion, stromal support and metabolic niches shape the marrow.", "CAR-T and T-cell-engager response depends on spatial accessibility, antigen retention and myeloid suppression.", "Proposes a spatial-temporal framework for progression and relapse."], "why": "Overview of how spatial data is being used in another marrow cancer.", "doi": "10.3390/cancers18193158", "pmid": "42882852", "g": "s"}];
const main=document.getElementById('main'),chips=document.getElementById('chips');
let cur='all';
function render(){
  main.innerHTML='';
  for(const k of Object.keys(G)){
    if(cur!=='all'&&cur!==k)continue;
    const items=P.filter(p=>p.g===k); if(!items.length)continue;
    const sec=document.createElement('section');sec.className='group';
    sec.innerHTML='<h2>'+G[k]+' ('+items.length+')</h2>';
    for(const p of items){
      const a=document.createElement('article');
      a.innerHTML='<div class="meta"><span class="tag'+(p.pre?' pre':'')+'">'+p.tag+'</span><span>'+p.j+'</span><span class="rel" title="Relevance to your project: '+p.rel+' of 5" aria-label="Relevance '+p.rel+' of 5">'+[1,2,3,4,5].map(i=>'<i class="'+(i<=p.rel?'on':'')+'"></i>').join('')+'</span></div>'+
      '<h3>'+p.t+'</h3><p class="sum">'+p.sum+'</p><div><h4>Main findings</h4><ul>'+p.f.map(x=>'<li>'+x+'</li>').join('')+'</ul></div>'+
      '<div class="why"><strong>Why it matters for you:</strong> '+p.why+'</div>'+
      '<div class="links"><a href="https://pubmed.ncbi.nlm.nih.gov/'+p.pmid+'/" target="_blank" rel="noopener">PMID '+p.pmid+'</a><a href="https://doi.org/'+p.doi+'" target="_blank" rel="noopener">DOI '+p.doi+'</a></div>';
      sec.appendChild(a);
    }
    main.appendChild(sec);
  }
}
function mk(k,l){const b=document.createElement('button');b.className='chip';b.type='button';b.textContent=l;b.setAttribute('aria-pressed',k===cur);b.onclick=()=>{cur=k;[...chips.children].forEach(c=>c.setAttribute('aria-pressed',c===b));render()};chips.appendChild(b)}
mk('all','All '+P.length);for(const k in G)mk(k,G[k]);
render();
</script>
