<title>Marrow Digest</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
/* Layout: masthead + filter chips + single reading column of paper cards; slide-stain palette (hematoxylin / eosin) */
:root{
  --bg:#f3f3f7; --surface:#ffffff; --fg:#1d1b2b; --muted:#5d5a72; --line:#dcdbe6;
  --hema:#4a3f8f; --hema-soft:#e8e5f6; --eosin:#b83a6e; --eosin-soft:#f8e4ec; --ok:#1f7a5a;
  --serif:"Source Serif 4",Georgia,serif; --sans:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14131d; --surface:#1d1c2a; --fg:#ecebf5; --muted:#a6a3bd; --line:#34324a;
  --hema:#a99cf0; --hema-soft:#2c2850; --eosin:#f08ab3; --eosin-soft:#44212f; --ok:#5fd0a5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14131d; --surface:#1d1c2a; --fg:#ecebf5; --muted:#a6a3bd; --line:#34324a;
  --hema:#a99cf0; --hema-soft:#2c2850; --eosin:#f08ab3; --eosin-soft:#44212f; --ok:#5fd0a5; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:32px 64px}
.wrap{max-width:820px;margin-inline:auto;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-direction:column;gap:10px;border-bottom:2px solid var(--hema);padding-bottom:20px}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--eosin)}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(30px,6vw,44px);line-height:1.1;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:0;max-width:65ch}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 13px var(--sans);padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--hema);border-color:var(--hema);color:var(--surface)}
.chip:focus-visible,a:focus-visible{outline:2px solid var(--eosin);outline-offset:2px}
.group{display:flex;flex-direction:column;gap:14px}
.group h2{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:500}
article{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-family:var(--mono);font-size:12px;color:var(--muted)}
.tag{background:var(--hema-soft);color:var(--hema);padding:2px 8px;border-radius:3px;font-weight:500}
.tag.pre{background:var(--eosin-soft);color:var(--eosin)}
.rel{display:inline-flex;gap:3px;align-items:center}
.rel i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.rel i.on{background:var(--eosin)}
h3{font-family:var(--serif);font-weight:600;font-size:21px;line-height:1.25;margin:0;text-wrap:balance}
.sum{margin:0;max-width:65ch}
h4{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--hema);margin:0 0 6px;font-weight:500}
ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px;max-width:65ch}
li::marker{color:var(--eosin)}
.why{background:var(--hema-soft);border-radius:4px;padding:10px 12px;font-size:14px}
.links{display:flex;flex-wrap:wrap;gap:6px 16px;font-family:var(--mono);font-size:12px}
a{color:var(--hema)}
footer{color:var(--muted);font-size:12px;font-family:var(--mono)}
@media(max-width:480px){article{padding:16px}}
</style>
<div class="wrap">
<header>
  <div class="kicker" id="kick">Digest · 5 Oct 2026</div>
  <h1>Marrow Digest</h1>
  <p class="lede">Eight new papers on the bone marrow microenvironment in AML/MDS, spatial proteomics, and pediatric leukemia. Papers already sent earlier are excluded.</p>
  <div class="chips" id="chips" role="group" aria-label="Filter by topic"></div>
</header>
<main id="main" class="wrap" style="gap:28px"></main>
<footer>Source: PubMed, entries since 1 Aug 2026. Preprints are not peer reviewed.</footer>
</div>
<script>
const G={s:"Spatial proteomics and imaging",p:"Pediatric AML, MDS and JMML",n:"Bone marrow niche in AML"};
const P=[
{g:"s",rel:5,tag:"bioRxiv preprint",pre:1,j:"bioRxiv · May 2026",pmid:"42239259",doi:"10.64898/2026.05.15.725421",
 t:"Niche-level immune evasion in TP53-mutant AML residual disease revealed by spatial proteomics",
 sum:"Sequential immunofluorescence on whole bone marrow biopsies from TP53-wild-type and TP53-mutant AML, at diagnosis and in morphological complete remission. Mutant cells were identified by high p53 and mapped against stromal and immune niches.",
 f:["At remission, TP53-mutant marrow shows B-cell loss and more regulatory T cells.","Erythroid and immature leukemia clusters persist in perisinusoidal niches, apart from T-cell clusters.","FOXP3-high Tregs sit close to mutant MRD cells.","scRNA-seq points to an erythroid to T-cell GDF15–CD48 axis as the suppression route."],
 why:"Closest match to your project: a spatial marrow map of AML tied to residual disease and relapse risk."},
{g:"s",rel:4,tag:"Method",j:"Cancer Discovery · Aug 2026",pmid:"41874448",doi:"10.1158/2159-8290.CD-25-0775",
 t:"Same-slide spatial multiomics with IN-DEPTH reveals tumor virus-linked reorganization of the microenvironment",
 sum:"A workflow where single-cell spatial proteomics imaging guides spatial transcriptomic capture on the same slide, without RNA loss. A graph method (SGCC) links protein and RNA layers. Tested on EBV-positive and EBV-negative DLBCL.",
 f:["Protein-first design keeps epitopes, RNA quality and tissue intact, on commercial platforms.","Found coordinated tumor, macrophage and CD4 T-cell remodeling.","C1Q-high suppressive macrophages and CD4 T-cell dysfunction in EBV-positive tumors.","Candidate IL27–STAT3 signaling axis."],
 why:"Shows one way to add transcriptomics to multiplexed protein imaging."},
{g:"s",rel:3,tag:"Original research",j:"Leukemia · 2026",pmid:"42271039",doi:"10.1038/s41375-026-02994-3",
 t:"Loss of systemic anti-viral immunity and LMP1-driven suppressive myeloid niches shape EBV-positive DLBCL",
 sum:"Combines functional profiling of circulating antiviral T cells with high-dimensional spatial proteomics of tumors and in vitro modelling.",
 f:["Antiviral T-cell responses are impaired in all DLBCL patients, most in EBV-positive.","Fewer intratumoral CD8+ T cells, more PD-1+ Tregs and exhausted T cells.","Dense PD-L1+/IDO1+ macrophage aggregates, concentrated around LMP1-expressing tumor cells.","This pattern was absent from EBV-positive Hodgkin lymphoma and infectious mononucleosis."],
 why:"A worked example of spatial niche analysis in a non-AML hematologic cancer."},
{g:"p",rel:4,tag:"Original research",j:"Life Science Alliance · Aug 2026",pmid:"42637517",doi:"10.26508/lsa.202603746",
 t:"Single-cell chromatin profiling reveals relapse-related priming in pediatric AML",
 sum:"scATAC-seq of 177,500 cells from 16 diagnostic pediatric AML samples (t(8;21), inv(16), FLT3-ITD) with long-term outcome, comparing relapsed and non-relapsed patients.",
 f:["Relapse-linked chromatin signatures are visible at diagnosis across subtypes.","Higher innate immune and inflammatory activation, and more HSC/MPP-like leukemic progenitors.","AP-1, RUNX1, SPI1 and ETS motifs drive the relapse state.","High expression of these regulators predicts worse survival in other AML cohorts."],
 why:"Pediatric cohort with outcome data, the same kind of link you want to make from spatial data."},
{g:"p",rel:4,tag:"Original research",j:"Cancer Letters · Oct 2026",pmid:"42830144",doi:"10.1016/j.canlet.2026.218866",
 t:"Reactive oxygen species define leukemia stem cell identity in pediatric AML",
 sum:"Pediatric AML cells were sorted by ROS level and tested for stemness, niche behavior and metabolism, including in mice and a 3D niche model.",
 f:["ROS-low cells are quiescent, form colonies serially and engraft in mice.","In the 3D niche model they settle in hypoxic regions and resist cytarabine.","Low oxidative phosphorylation, yet they depend on complex I.","A ROS-low gene signature finds stem cells in scRNA-seq data and is prognostic."],
 why:"Links stem cell state to hypoxic niche location in children."},
{g:"p",rel:4,tag:"Original research",j:"Blood · Sep 2026",pmid:"42233403",doi:"10.1182/blood.2025032588",
 t:"Targeting IL-17A-driven PTGS2/NLRP3 inflammasome activation in juvenile myelomonocytic leukemia",
 sum:"A Shp2 E76K/+ (PTPN11) JMML mouse model, patient samples and xenografts. JMML is a pediatric MDS/MPN overlap disease.",
 f:["Mutant macrophages raise IL-17A, activating NLRP3, PTGS2 and IL-1β in the marrow.","Tregs expand, T cells become exhausted and lose cytotoxicity.","IL-17A blockade, or NLRP3 plus PTGS2 inhibition with MEK inhibition, restored T-cell function and lengthened survival.","Dual inhibition plus MEK blockade also worked in patient-derived xenografts."],
 why:"Pediatric myeloid disease with the mouse validation step you plan."},
{g:"n",rel:3,tag:"Original research",j:"Blood · Oct 2026",pmid:"42360909",doi:"10.1182/blood.2026033125",
 t:"FGF18 mediates fibroblast–leukemia cross talk to promote AML progression",
 sum:"scRNA-seq of the AML marrow niche, fibroblast-specific knockout, a CRISPR screen in AML cells and a neutralizing antibody in mice.",
 f:["Stromal fibroblasts upregulate Fgf18; deleting it delays disease and extends survival.","FGF18 acts through FGFR3, AKT–mTOR and IL-6, which feeds back on fibroblast JAK–STAT3.","The loop suppresses CD8+ T-cell function.","High FGF18 predicts poor prognosis; the antibody restores CD8 function and adds to anti-PD-1."],
 why:"A defined stromal cell to leukemia signaling loop, tested in vivo."},
{g:"n",rel:2,tag:"Original research",j:"J Transl Intern Med · Aug 2026",pmid:"42657369",doi:"10.1515/jtim-2026-0048",
 t:"Bone marrow mesenchymal stem cells are functionally remodeled after complete remission of AML",
 sum:"Marrow MSCs from de novo AML, AML in complete remission and healthy donors were compared for function, senescence and transcriptome, with an AML remission mouse model.",
 f:["Dysfunctional AML MSCs recover in remission and resemble healthy MSCs.","Fewer senescent MSCs after remission.","Remission MSCs can still be pushed back into senescence by AML cells."],
 why:"Shows the stroma is plastic and tracks disease state."}
];
const main=document.getElementById('main'),chips=document.getElementById('chips');
let cur='all';
function render(){
  main.innerHTML='';
  for(const k of Object.keys(G)){
    if(cur!=='all'&&cur!==k)continue;
    const items=P.filter(p=>p.g===k); if(!items.length)continue;
    const sec=document.createElement('section');sec.className='group';
    sec.innerHTML='<h2>'+G[k]+' ('+items.length+')</h2>';
    for(const p of items){
      const a=document.createElement('article');
      a.innerHTML='<div class="meta"><span class="tag'+(p.pre?' pre':'')+'">'+p.tag+'</span><span>'+p.j+'</span><span class="rel" title="Relevance to your project: '+p.rel+' of 5" aria-label="Relevance '+p.rel+' of 5">'+[1,2,3,4,5].map(i=>'<i class="'+(i<=p.rel?'on':'')+'"></i>').join('')+'</span></div>'+
      '<h3>'+p.t+'</h3><p class="sum">'+p.sum+'</p><div><h4>Main findings</h4><ul>'+p.f.map(x=>'<li>'+x+'</li>').join('')+'</ul></div>'+
      '<div class="why"><strong>Why it matters for you:</strong> '+p.why+'</div>'+
      '<div class="links"><a href="https://pubmed.ncbi.nlm.nih.gov/'+p.pmid+'/" target="_blank" rel="noopener">PMID '+p.pmid+'</a><a href="https://doi.org/'+p.doi+'" target="_blank" rel="noopener">DOI '+p.doi+'</a></div>';
      sec.appendChild(a);
    }
    main.appendChild(sec);
  }
}
function mk(k,l){const b=document.createElement('button');b.className='chip';b.type='button';b.textContent=l;b.setAttribute('aria-pressed',k===cur);b.onclick=()=>{cur=k;[...chips.children].forEach(c=>c.setAttribute('aria-pressed',c===b));render()};chips.appendChild(b)}
mk('all','All '+P.length);for(const k in G)mk(k,G[k]);
render();
</script>
